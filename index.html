<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Ops — The Global Monitor</title>
<meta name="description" content="Personal daily schedule and habit tracker.">
<meta name="theme-color" content="#1c1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ops">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #eae3d2;
  }
  body {
    font-family: 'Inter', sans-serif;
    color: #1c1a14;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --paper: #eae3d2;
    --paper-dim: #ded5bf;
    --ink: #1c1a14;
    --ink-soft: #57503f;
    --green: #33553b;
    --green-bright: #5c9a5f;
    --brick: #a53a28;
    --brass: #93712f;
    --line: rgba(28,26,20,0.16);
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Fraunces', serif; }

  #ops-root {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    background-image: radial-gradient(rgba(28,26,20,0.05) 0.6px, transparent 0.6px);
    background-size: 3px 3px;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header / SITREP ---- */
  .sitrep {
    background: var(--ink);
    color: var(--paper);
    padding: 18px 26px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 3px solid var(--green-bright);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .sitrep-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.02em;
  }
  .sitrep-title span { color: var(--green-bright); }
  .sitrep-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #b5ac95;
    margin-top: 3px;
  }
  .countdowns { display: flex; gap: 28px; }
  .countdown-item { text-align: right; }
  .countdown-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight: 600;
    color: var(--green-bright);
    line-height: 1;
  }
  .countdown-lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #9d947c;
    margin-top: 4px;
  }

  /* ---- Date nav ---- */
  .datebar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-dim);
    position: sticky;
    /* Measured from the header at runtime — the header's height changes with
       viewport width, and a hardcoded offset left it tucked underneath. */
    top: var(--sitrep-h, 73px);
    z-index: 9;
  }
  .datebar button {
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    width: 30px; height: 30px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    line-height: 1;
  }
  .datebar button:hover { background: var(--ink); color: var(--paper); }
  .datebar .cur-date {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    min-width: 210px;
    text-align: center;
  }
  .datebar .today-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid var(--green);
    color: var(--green);
    background: none;
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    width: auto;
    height: auto;
  }
  .datebar .today-btn:hover { background: var(--green); color: var(--paper); }

  /* ---- Body grid ---- */
  .body-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 0;
    flex: 1;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }
  @media (max-width: 780px) {
    .body-grid { grid-template-columns: 1fr; }
    .col-schedule { border-right: none !important; border-bottom: 1px solid var(--line); }
    .sitrep { padding: 14px 18px; }
    .sitrep-title { font-size: 21px; }
    .countdown-num { font-size: 19px; }
    /* The header is 124px on a phone — pinning it too would eat a fifth of the
       screen. The date nav is the part worth keeping in reach. */
    .sitrep { position: static; }
    .datebar { top: 0; }
  }

  /* These strips scroll sideways by design; the scrollbar itself is noise. */
  .priority-strip::-webkit-scrollbar,
  .daybar-tools::-webkit-scrollbar { display: none; }
  .priority-strip, .daybar-tools { scrollbar-width: none; }

  /* Keyboard focus needs to be visible now that arrow keys and T move the day. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--green-bright);
    outline-offset: 2px;
  }

  .col { padding: 24px 26px 30px; }
  .col-schedule { border-right: 1px solid var(--line); }

  .col-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
  }
  .col-head h3 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .col-head .tally {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---- Schedule blocks ---- */
  .block-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
  .block {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cat-color, var(--green));
    border-radius: 4px;
  }
  .block.done { opacity: 0.5; }
  .block.done .block-label { text-decoration: line-through; }
  .block-check {
    width: 19px; height: 19px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none;
  }
  .block-check.checked { background: var(--green); border-color: var(--green); }
  .block-check.checked::after { content: '✓'; color: var(--paper); font-size: 13px; line-height: 1; }
  .block-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    width: 56px;
    flex-shrink: 0;
  }
  .block-label { font-size: 14.5px; flex: 1; }
  .block-cat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .block-del {
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); font-size: 17px; line-height: 1;
    padding: 2px 4px;
  }
  .block-del:hover { color: var(--brick); }

  .add-form {
    display: flex; gap: 7px; flex-wrap: wrap;
    padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .add-form input[type=time] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 8px;
    background: white;
    width: 96px;
  }
  .add-form input[type=text] {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 9px;
    background: white;
    flex: 1;
    min-width: 120px;
  }
  .add-form select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 6px;
    background: white;
  }
  .add-form button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .add-form button:hover { background: var(--green); }
  .empty-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 12px 2px;
  }

  /* ---- Habits ---- */
  .habit-row {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .habit-row:last-of-type { border-bottom: none; }
  .habit-name { font-size: 14px; flex: 1; min-width: 140px; }
  .habit-streak {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--brass);
    white-space: nowrap;
  }
  .week-grid { display: flex; gap: 3px; }
  .week-cell {
    width: 16px; height: 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: white;
  }
  .week-cell.on { background: var(--green-bright); border-color: var(--green); }
  .habit-del {
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); font-size: 15px; padding: 0 2px;
  }
  .habit-del:hover { color: var(--brick); }

  .add-habit-form {
    display: flex; gap: 7px; margin-top: 14px; padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .add-habit-form input {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 9px;
    background: white;
    flex: 1;
  }
  .add-habit-form button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .add-habit-form button:hover { background: var(--green); }

  /* ---- Priority strip ---- */
  .priority-strip {
    display: flex;
    border-top: 1px solid var(--line);
    background: var(--ink);
    padding: 11px 26px;
    gap: 0;
    overflow-x: auto;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }
  .priority-strip .p-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #9d947c;
    white-space: nowrap;
    padding: 0 14px;
    border-right: 1px solid rgba(255,255,255,0.15);
  }
  .priority-strip .p-item:first-child { padding-left: 0; }
  .priority-strip .p-item:last-child { border-right: none; }
  .priority-strip .p-item b { color: var(--green-bright); }

  /* ---- Analytics ---- */
  .charts-section {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 26px 30px;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 30px;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 780px) {
    .charts-section {
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 22px 18px 26px;
    }
  }

  /* Donut */
  .donut-wrap { position: relative; width: 164px; margin: 6px auto 0; }
  .donut { width: 164px; height: 164px; display: block; }
  .donut-track { fill: none; stroke: rgba(28,26,20,0.10); stroke-width: 17; }
  .donut-val {
    fill: none;
    stroke-width: 17;
    transition: stroke-dasharray 0.45s ease, stroke-dashoffset 0.45s ease;
  }
  .donut-blocks { stroke: var(--green-bright); }
  .donut-habits { stroke: var(--brass); }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .donut-pct {
    font-family: 'Fraunces', serif;
    font-size: 33px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .donut-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .donut-legend {
    margin-top: 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .legend-row {
    display: flex; align-items: center; gap: 9px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--dot, var(--green-bright));
    flex-shrink: 0;
  }
  .legend-row b {
    margin-left: auto;
    color: var(--ink);
    font-weight: 600;
  }

  /* 7-day bars */
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    height: 196px;
    padding-top: 6px;
  }
  .bar-col {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    height: 100%;
    min-width: 0;
  }
  .bar-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 5px;
    line-height: 1;
  }
  .bar-track {
    flex: 1;
    width: 100%;
    background: rgba(28,26,20,0.05);
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .bar-fill {
    width: 100%;
    background: var(--green-bright);
    transition: height 0.45s ease;
  }
  .bar-col.is-full .bar-fill { background: var(--green); }
  .bar-col.is-today .bar-track { border-color: var(--brass); border-width: 1.5px; }
  .bar-col.is-today .bar-day { color: var(--brass); font-weight: 600; }
  .bar-day {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .bar-foot {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex;
    justify-content: space-between;
  }
  .bar-foot b { color: var(--ink); font-weight: 600; }

  /* ---- Day toolbar ---- */
  .daybar-tools {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    padding: 9px 20px;
    background: var(--paper-dim);
    border-bottom: 1px solid var(--line);
  }
  .tool-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 3px;
    padding: 6px 11px;
    cursor: pointer;
  }
  .tool-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tool-btn.danger:hover { background: var(--brick); border-color: var(--brick); }

  .viewing-badge {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--brass);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 7px 20px;
  }
  .viewing-badge.on { display: flex; }
  .viewing-badge button {
    background: none;
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    border-radius: 3px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .viewing-badge button:hover { background: rgba(255,255,255,0.18); }

  .cd-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: right;
    font: inherit;
  }
  .cd-btn:hover .countdown-num { text-decoration: underline dotted; }

  /* ---- Fitness ---- */
  .fitness-section {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 26px 30px;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 780px) { .fitness-section { padding: 22px 18px 26px; } }
  .fit-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 4px;
  }
  @media (max-width: 780px) { .fit-grid { grid-template-columns: repeat(2, 1fr); } }
  .fit-card {
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--line);
    border-top: 3px solid var(--metric-color, var(--green));
    border-radius: 4px;
    padding: 12px 13px 13px;
  }
  .fit-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .fit-val {
    font-family: 'Fraunces', serif;
    font-size: 25px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
    margin-top: 5px;
  }
  .fit-val.none { color: var(--ink-soft); font-size: 18px; }
  .fit-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .fit-bar {
    height: 5px;
    background: rgba(28,26,20,0.08);
    border-radius: 3px;
    margin-top: 9px;
    overflow: hidden;
  }
  .fit-bar span {
    display: block;
    height: 100%;
    background: var(--metric-color, var(--green));
    transition: width 0.45s ease;
  }
  .fit-delta { font-weight: 600; }
  .fit-delta.good { color: var(--green); }
  .fit-delta.bad { color: var(--brick); }

  .fit-form {
    display: flex; gap: 7px; flex-wrap: wrap;
    margin-top: 16px; padding-top: 13px;
    border-top: 1px dashed var(--line);
  }
  .fit-form select, .fit-form input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 8px;
    background: white;
  }
  .fit-form input[type=text] { width: 110px; }
  .fit-form button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none; border-radius: 3px;
    padding: 7px 14px; cursor: pointer;
  }
  .fit-form button:hover { background: var(--green); }
  .fit-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 9px;
    line-height: 1.5;
  }

  /* ---- Daily Notes ---- */
  .notes-section {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 26px 30px;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 780px) { .notes-section { padding: 22px 18px 26px; } }
  .notes-form {
    display: flex; gap: 7px;
    margin-bottom: 14px;
  }
  .notes-form input[type=text] {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
    background: white;
  }
  .notes-form button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none; border-radius: 3px;
    padding: 7px 14px; cursor: pointer;
  }
  .notes-form button:hover { background: var(--green); }
  .note-row {
    display: flex;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    align-items: baseline;
  }
  .note-row:last-child { border-bottom: none; }
  .note-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    flex-shrink: 0;
    width: 52px;
  }
  .note-text {
    flex: 1;
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.4;
  }
  .note-del {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--ink-soft);
    background: none; border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .note-del:hover { color: var(--brick); }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(14px);
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 11px 18px;
    border-radius: 4px;
    border-left: 3px solid var(--green-bright);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 50;
    max-width: 90vw;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.warn { border-left-color: var(--brick); }

  .loading-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 40px 20px;
    text-align: center;
  }

  footer.site-foot {
    text-align: center;
    padding: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .sync-status.ok { color: var(--green); }
  .sync-status.warn { color: var(--brick); }

  /* Selectable on purpose: this id has to be copied into the database
     rules by hand whenever a new device is added. */
  .device-id {
    display: block;
    margin-top: 4px;
    font-size: 9px;
    opacity: 0.6;
    user-select: all;
    -webkit-user-select: all;
  }

  /* ---- Mobile overrides ----
     These sit at the very end of the sheet on purpose: they need to beat the
     base .habit-row and .daybar-tools rules, which are declared further down
     than the earlier @media block and would otherwise win on source order. */
  @media (max-width: 780px) {
    /* Two tidy lines instead of five wrapped fragments. */
    .habit-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "check name del"
        "week  week streak";
      gap: 7px 10px;
      align-items: center;
      padding: 11px 0;
    }
    .habit-row > .block-check  { grid-area: check; }
    .habit-row > .habit-name   { grid-area: name; min-width: 0; }
    .habit-row > .habit-streak { grid-area: streak; text-align: right; }
    .habit-row > .week-grid    { grid-area: week; }
    .habit-row > .habit-del    { grid-area: del; }

    /* One swipeable row rather than three stacked rows of buttons. */
    .daybar-tools {
      flex-wrap: nowrap;
      overflow-x: auto;
      justify-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }
    .daybar-tools .tool-btn { flex: 0 0 auto; }
  }

  /* Embedded mode — hides the title/countdown banner when loaded
     inside another app (e.g. SITREP) that already shows this info
     in its own header. Triggered by ?embed=1 in the URL. */
  body.embedded .sitrep { display: none; }
</style>
</head>
<body>

<div id="ops-root">
  <div class="sitrep">
    <div>
      <div class="sitrep-title">DAILY <span>PLANNER</span></div>
      <div class="sitrep-sub">Habit Tracker</div>
    </div>
    <div class="countdowns">
      <button class="cd-btn countdown-item" id="ops-edit-aosb" title="Click to change the date">
        <div class="countdown-num mono" id="ops-cd-aosb">—</div>
        <div class="countdown-lbl">Days to AOSB</div>
      </button>
      <button class="cd-btn countdown-item" id="ops-edit-sandhurst" title="Click to change the date">
        <div class="countdown-num mono" id="ops-cd-sandhurst">—</div>
        <div class="countdown-lbl">Days to Sandhurst</div>
      </button>
    </div>
  </div>

  <div class="datebar">
    <button id="ops-prev" title="Previous day (←)">‹</button>
    <div class="cur-date" id="ops-cur-date">—</div>
    <button id="ops-next" title="Next day (→)">›</button>
    <button class="today-btn" id="ops-today" title="Jump to today (T)">Today</button>
  </div>

  <div class="viewing-badge" id="ops-viewing">
    <span id="ops-viewing-text">Viewing another day</span>
    <button id="ops-viewing-back">Back to today</button>
  </div>

  <div class="daybar-tools">
    <button class="tool-btn" id="ops-copy-prev" title="Copy the previous day's blocks into this day">Copy previous day</button>
    <button class="tool-btn" id="ops-save-tpl" title="Save this day's blocks as your default day">Save as template</button>
    <button class="tool-btn" id="ops-apply-tpl" title="Add your saved template to this day">Apply template</button>
    <button class="tool-btn" id="ops-export" title="Download a backup of all your data">Export backup</button>
    <button class="tool-btn" id="ops-import" title="Restore from a backup file">Import backup</button>
    <input type="file" id="ops-import-file" accept="application/json,.json" hidden>
  </div>

  <div id="ops-body" class="loading-note">Loading planner…</div>

  <footer class="site-foot">DAILY OPS — <span class="sync-status" id="ops-sync-status">CONNECTING…</span><span class="device-id" id="ops-device-id"></span></footer>
</div>

<div class="toast" id="ops-toast"></div>

<script>
(function() {
  // Embedded mode: ?embed=1 hides this app's own title/countdown
  // banner, since the parent (SITREP) shows that info in its own
  // header when this is loaded inside an iframe.
  if (new URLSearchParams(window.location.search).get('embed') === '1') {
    document.body.classList.add('embedded');
  }

  const CAT_COLORS = {
    Trading: '#33553b',
    Sandhurst: '#93712f',
    Uni: '#4a5d7a',
    Gym: '#a53a28',
    Diet: '#6b7a2e',
    Faith: '#5a4a7a',
    Content: '#7a5230',
    Personal: '#5c5647'
  };

  const STORE_KEYS = {
    schedule: 'ops:schedule',
    habits: 'ops:habits',
    habitLog: 'ops:habitlog',
    template: 'ops:template',
    targets: 'ops:targets',
    fitness: 'ops:fitness',
    notes: 'ops:notes'
  };

  // Date-only ISO, matching what /sitrep/aosbDate and /sitrep/sandhurstDate
  // hold. Sandhurst was 2027-09-01 here and 2027-09-07 in SITREP; the
  // September 7th intake is the correct one.
  const DEFAULT_TARGETS = { aosb: '2026-10-12', sandhurst: '2027-09-07' };

  // Lower is better for the run, higher is better for everything else.
  const METRICS = {
    pressups: { label: 'Press-ups',  unit: 'reps',  kind: 'count', lowerBetter: false, color: '#33553b' },
    situps:   { label: 'Sit-ups',    unit: 'reps',  kind: 'count', lowerBetter: false, color: '#93712f' },
    msft:     { label: 'Bleep Test', unit: 'level', kind: 'level', lowerBetter: false, color: '#4a5d7a' }
  };

  let state = {
    scheduleAll: {}, habits: [], habitLog: {},
    template: [], targets: Object.assign({}, DEFAULT_TARGETS),
    fitness: { entries: [], targets: {} },
    notesAll: {}
  };
  let currentDate = new Date();

  function fmtDate(d) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtDisplay(d) {
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function daysBetween(a, b) {
    const ms = 24*60*60*1000;
    const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((db - da) / ms);
  }
  function uid() { return Math.random().toString(36).slice(2, 9); }

  function loadAll() {
    try {
      const s = localStorage.getItem(STORE_KEYS.schedule);
      state.scheduleAll = s ? JSON.parse(s) : {};
    } catch(e) { state.scheduleAll = {}; }

    try {
      const h = localStorage.getItem(STORE_KEYS.habits);
      state.habits = h ? JSON.parse(h) : null;
    } catch(e) { state.habits = null; }
    if (!state.habits) {
      state.habits = [
        { id: uid(), name: 'NQ trading session logged' },
        { id: uid(), name: 'Sandhurst prep — fitness/study' },
        { id: uid(), name: 'Gym' },
        { id: uid(), name: 'Uni / placement work block' },
        { id: uid(), name: 'Global Monitor / LinkedIn content' },
        { id: uid(), name: 'Investing check-in' }
      ];
      saveHabits();
    }

    try {
      const l = localStorage.getItem(STORE_KEYS.habitLog);
      state.habitLog = l ? JSON.parse(l) : {};
    } catch(e) { state.habitLog = {}; }

    try {
      const t = localStorage.getItem(STORE_KEYS.template);
      state.template = t ? JSON.parse(t) : [];
    } catch(e) { state.template = []; }

    try {
      const g = localStorage.getItem(STORE_KEYS.targets);
      state.targets = Object.assign({}, DEFAULT_TARGETS, g ? JSON.parse(g) : {});
    } catch(e) { state.targets = Object.assign({}, DEFAULT_TARGETS); }

    try {
      const f = localStorage.getItem(STORE_KEYS.fitness);
      const parsed = f ? JSON.parse(f) : null;
      state.fitness = {
        entries: (parsed && Array.isArray(parsed.entries)) ? parsed.entries : [],
        targets: (parsed && parsed.targets) ? parsed.targets : {}
      };
    } catch(e) { state.fitness = { entries: [], targets: {} }; }

    try {
      const n = localStorage.getItem(STORE_KEYS.notes);
      state.notesAll = n ? JSON.parse(n) : {};
    } catch(e) { state.notesAll = {}; }
  }

  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch(e) {
      console.error('save failed for ' + key, e);
      toast('Could not save — device storage may be full', true);
      return false;
    }
    Sync.push(key, value);
    return true;
  }

  function saveSchedule() { save(STORE_KEYS.schedule, state.scheduleAll); }
  function saveHabits()   { save(STORE_KEYS.habits, state.habits); }
  function saveHabitLog() { save(STORE_KEYS.habitLog, state.habitLog); }
  function saveTemplate() { save(STORE_KEYS.template, state.template); }
  function saveTargets()  { save(STORE_KEYS.targets, state.targets); }
  function saveNotes()    { save(STORE_KEYS.notes, state.notesAll); }
  function saveFitness()  { save(STORE_KEYS.fitness, state.fitness); }

  /* ================================================================
     Firebase Realtime Database sync (shared with SITREP)

     Every local write is mirrored straight to the database with a PUT,
     and a poll pulls the whole /sitrep blob back down every 15s so the
     other device picks up changes. There is no SDK — the REST endpoint
     is hit directly, which keeps this a single static file with no
     build step.

     Requests carry an anonymous-auth ID token so the database rules can
     stop being world-writable. Anonymous sign-in mints a NEW uid per
     device, so the rules allowlist each device's uid explicitly rather
     than scoping to the caller's own subtree — scoping per-uid would
     put the phone and the PC in separate trees and defeat the sync.
     Read the device id off the footer to add a new device.

     REMOTE_KEYS holds what is private to this app, under an ops_
     prefix. Everything there stays this app's own: SITREP models the
     same ideas differently — its habit tracker is a fixed five-item
     list where this one is freely named and id'd — and merging those
     would corrupt one side or both.

     SHARED_FIELDS holds the exception. The AOSB and Sandhurst dates
     are the same real-world fact in both apps, so they sit at the top
     level of /sitrep under names neither app owns, and both read and
     write them. They are stored as bare date-only ISO strings because
     that is the fact; SITREP's 08:00 on its milestones is presentation
     and belongs to SITREP, so each side adapts on the way in and out.
     ================================================================ */
  const SYNC_DB = 'https://sitrep-sync-default-rtdb.europe-west1.firebasedatabase.app';
  const SYNC_ROOT = 'sitrep';
  const SYNC_INTERVAL = 15000;

  const REMOTE_KEYS = {
    [STORE_KEYS.schedule]: 'ops_schedule',
    [STORE_KEYS.habits]:   'ops_habits',
    [STORE_KEYS.habitLog]: 'ops_habitlog',
    [STORE_KEYS.template]: 'ops_template',
    [STORE_KEYS.fitness]:  'ops_fitness'
  };
  const LOCAL_KEYS = {};
  Object.keys(REMOTE_KEYS).forEach(k => { LOCAL_KEYS[REMOTE_KEYS[k]] = k; });

  // Individual fields lifted out of a local blob and shared with SITREP
  // as top-level keys. localStorage key -> { field: remote key }.
  const SHARED_FIELDS = {
    [STORE_KEYS.targets]: { aosb: 'aosbDate', sandhurst: 'sandhurstDate' }
  };
  const SHARED_LOOKUP = {};
  Object.keys(SHARED_FIELDS).forEach(localKey => {
    const fields = SHARED_FIELDS[localKey];
    Object.keys(fields).forEach(field => { SHARED_LOOKUP[fields[field]] = { localKey, field }; });
  });

  // Deliberately not in REMOTE_KEYS: the credential is this device's, and
  // syncing it would hand every device the same identity.
  const AUTH_KEYS = { refresh: 'ops:authrefresh', uid: 'ops:authuid' };
  const SYNC_API_KEY = 'AIzaSyA9mmyaqyKBSItLMaRWy1Hs6koyZPsWlnY';

  const Auth = (function() {
    let idToken = null;
    let expiresAt = 0;
    let uid = null;
    let pending = null;
    // Set only when the provider is switched off in the Firebase console.
    // A network failure must NOT land here, or going offline for a moment
    // would leave the tab unauthenticated until it is reloaded.
    let disabled = false;

    try { uid = localStorage.getItem(AUTH_KEYS.uid); } catch(e) {}

    function post(endpoint, body) {
      return fetch(endpoint + '?key=' + SYNC_API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(res => res.json().then(json => {
        if (!res.ok) {
          const reason = (json && json.error && json.error.message) || ('HTTP ' + res.status);
          const err = new Error(reason);
          // Anonymous sign-in not turned on, or Authentication never
          // enabled on the project at all (CONFIGURATION_NOT_FOUND).
          // Retrying these is pointless — it is a console setting, so
          // give up for the session rather than paying a failed request
          // on every push and every poll.
          err.fatal = /OPERATION_NOT_ALLOWED|ADMIN_ONLY_OPERATION|CONFIGURATION_NOT_FOUND/.test(reason);
          throw err;
        }
        return json;
      }));
    }

    function store(res) {
      idToken = res.idToken || res.id_token;
      uid = res.localId || res.user_id || uid;
      const ttl = Number(res.expiresIn || res.expires_in || 3600);
      // Renewed a minute early so a token cannot expire mid-request.
      expiresAt = Date.now() + (ttl - 60) * 1000;
      try {
        const rt = res.refreshToken || res.refresh_token;
        if (rt) localStorage.setItem(AUTH_KEYS.refresh, rt);
        if (uid) localStorage.setItem(AUTH_KEYS.uid, uid);
      } catch(e) {}
      showDeviceId();
      return idToken;
    }

    function signUp() {
      return post('https://identitytoolkit.googleapis.com/v1/accounts:signUp', { returnSecureToken: true });
    }

    function refresh(rt) {
      return post('https://securetoken.googleapis.com/v1/token', { grant_type: 'refresh_token', refresh_token: rt });
    }

    // Resolves to an ID token, or to null when auth is unavailable. Null is
    // not treated as an error: while the rules are still open the app has
    // to keep working unauthenticated, which is what makes it safe to ship
    // this before the rules are published.
    function token() {
      if (disabled) return Promise.resolve(null);
      if (idToken && Date.now() < expiresAt) return Promise.resolve(idToken);
      if (pending) return pending;

      let rt = null;
      try { rt = localStorage.getItem(AUTH_KEYS.refresh); } catch(e) {}

      // A stored refresh token can be revoked or simply stale, in which
      // case signing up again gets this device a fresh identity.
      pending = (rt ? refresh(rt).catch(() => signUp()) : signUp())
        .then(store)
        .catch(err => {
          if (err && err.fatal) {
            disabled = true;
            console.warn('anonymous auth is not enabled for this project — continuing unauthenticated', err);
          } else {
            console.warn('auth failed, will retry', err);
          }
          return null;
        })
        .then(t => { pending = null; return t; });

      return pending;
    }

    function showDeviceId() {
      const el = document.getElementById('ops-device-id');
      if (el && uid) el.textContent = 'DEVICE ' + uid;
    }

    return { token, showDeviceId, uid: () => uid };
  })();

  // A rules rejection and a dead connection both surface as a failed
  // fetch, but they need different wording: one is fixed in the Firebase
  // console, the other fixes itself.
  function httpError(res) {
    const err = new Error('HTTP ' + res.status);
    err.denied = (res.status === 401 || res.status === 403);
    return err;
  }

  function withAuth(url, token) {
    if (!token) return url;
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 'auth=' + encodeURIComponent(token);
  }

  const Sync = (function() {
    let enabled = true;
    let timer = null;
    // A poll that overlaps one of our own writes would hand back the
    // pre-write value and roll the edit back on screen. Keys stay
    // quarantined from inbound merges while a PUT is in flight, plus a
    // short grace period afterwards for the write to propagate.
    const inflight = {};
    const settledAt = {};
    // On a device that has never run the app, loadAll() seeds the
    // default habit list and saves it. Left alone that write would
    // reach the database before the first pull and overwrite the real
    // list from the other device. So pushes are held until the first
    // pull lands, then only replayed for keys the database had nothing
    // for.
    let holding = false;
    const held = {};

    function url(remoteKey) {
      return SYNC_DB + '/' + SYNC_ROOT + (remoteKey ? '/' + remoteKey : '') + '.json';
    }

    function setStatus(text, cls) {
      const el = document.getElementById('ops-sync-status');
      if (el) { el.textContent = text; el.className = 'sync-status ' + (cls || ''); }
    }

    function quarantined(remoteKey) {
      return (inflight[remoteKey] || 0) > 0 || (Date.now() - (settledAt[remoteKey] || 0)) < 3000;
    }

    // One local key can fan out to several remote ones: the targets blob
    // is split into the two dates shared with SITREP.
    function outgoing(localKey, value) {
      const fields = SHARED_FIELDS[localKey];
      if (fields) {
        return Object.keys(fields)
          .map(field => [fields[field], value ? value[field] : null])
          .filter(pair => pair[1] !== null && pair[1] !== undefined);
      }
      const remoteKey = REMOTE_KEYS[localKey];
      return remoteKey ? [[remoteKey, value]] : [];
    }

    function send(remoteKey, payload) {
      inflight[remoteKey] = (inflight[remoteKey] || 0) + 1;
      Auth.token().then(tok => fetch(withAuth(url(remoteKey), tok), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })).then(res => {
        if (!res.ok) throw httpError(res);
        setStatus('SYNCED', 'ok');
      }).catch(err => {
        console.warn('sync push failed for ' + remoteKey, err);
        setStatus(err && err.denied ? 'NOT AUTHORISED — SAVED ON THIS DEVICE'
                                    : 'OFFLINE — SAVED ON THIS DEVICE', 'warn');
      }).then(() => {
        inflight[remoteKey] = Math.max(0, (inflight[remoteKey] || 1) - 1);
        settledAt[remoteKey] = Date.now();
      });
    }

    function push(localKey, value) {
      if (!enabled) return;
      const pairs = outgoing(localKey, value);
      if (!pairs.length) return;
      if (holding) { held[localKey] = value; return; }
      pairs.forEach(pair => send(pair[0], pair[1]));
    }

    // Applies anything the other device changed. Returns true if local
    // state actually moved, so the caller only repaints when it must.
    function applyRemote(blob) {
      let changed = false;

      Object.keys(blob || {}).forEach(remoteKey => {
        const localKey = LOCAL_KEYS[remoteKey];
        if (!localKey || quarantined(remoteKey)) return;

        const incoming = blob[remoteKey];
        if (incoming === null || incoming === undefined) return;

        let current;
        try { current = localStorage.getItem(localKey); } catch(e) { return; }
        const next = JSON.stringify(incoming);
        if (current === next) return;

        // Written straight to localStorage rather than through save():
        // save() would push it back out and the two devices would
        // bounce the same value between them forever.
        try { localStorage.setItem(localKey, next); } catch(e) { return; }
        changed = true;
      });

      // The shared dates arrive as separate top-level keys and have to be
      // folded back into this app's targets blob. Merged field by field
      // rather than replacing the blob, so a date SITREP has never
      // written doesn't wipe the one held here.
      Object.keys(SHARED_FIELDS).forEach(localKey => {
        const fields = SHARED_FIELDS[localKey];

        let parsed = {};
        try {
          const current = localStorage.getItem(localKey);
          if (current) parsed = JSON.parse(current) || {};
        } catch(e) { parsed = {}; }

        const merged = Object.assign({}, parsed);
        let touched = false;

        Object.keys(fields).forEach(field => {
          const remoteKey = fields[field];
          if (quarantined(remoteKey)) return;
          const incoming = (blob || {})[remoteKey];
          if (incoming === null || incoming === undefined) return;
          if (merged[field] === incoming) return;
          merged[field] = incoming;
          touched = true;
        });

        if (!touched) return;
        try { localStorage.setItem(localKey, JSON.stringify(merged)); } catch(e) { return; }
        changed = true;
      });

      if (changed) loadAll();
      return changed;
    }

    function hold() { holding = true; }

    // Replays held writes, but only for keys the database had nothing
    // for — anything it did have has already been merged in by
    // applyRemote, and the held copy is the stale one.
    function release(blob) {
      if (!holding) return;
      holding = false;
      Object.keys(held).forEach(localKey => {
        outgoing(localKey, held[localKey]).forEach(pair => {
          const seen = blob && blob[pair[0]] !== undefined && blob[pair[0]] !== null;
          if (!seen) send(pair[0], pair[1]);
        });
        delete held[localKey];
      });

      // Nothing calls saveTargets() on a first run, so unlike the other
      // keys the shared dates are never queued for pushing and would sit
      // out of the database until the user happened to edit one. Seed
      // whatever it is missing from what this device is already showing.
      Object.keys(SHARED_FIELDS).forEach(localKey => {
        const source = currentShared(localKey);
        if (!source) return;
        const fields = SHARED_FIELDS[localKey];
        Object.keys(fields).forEach(field => {
          const remoteKey = fields[field];
          const seen = blob && blob[remoteKey] !== undefined && blob[remoteKey] !== null;
          if (seen || !source[field]) return;
          send(remoteKey, source[field]);
        });
      });
    }

    // The in-memory blob a shared field is read back out of. Targets is
    // the only shared blob today; extend here alongside SHARED_FIELDS.
    function currentShared(localKey) {
      return localKey === STORE_KEYS.targets ? state.targets : null;
    }

    function pull() {
      if (!enabled) return Promise.resolve(false);

      // Re-rendering mid-edit throws away whatever is half-typed in the
      // add-block or add-habit field. The next poll picks it up.
      const focus = document.activeElement;
      if (focus && /^(INPUT|SELECT|TEXTAREA)$/.test(focus.tagName)) return Promise.resolve(false);

      return Auth.token()
        .then(tok => fetch(withAuth(url(null) + '?t=' + Date.now(), tok), { cache: 'no-store' }))
        .then(res => {
          if (!res.ok) throw httpError(res);
          return res.json();
        })
        .then(blob => {
          const changed = applyRemote(blob);
          release(blob);
          setStatus('SYNCED', 'ok');
          if (changed) {
            updateCountdowns();
            renderDateBar();
            renderBody();
            toast('Updated from your other device');
          }
          return changed;
        })
        .catch(err => {
          console.warn('sync pull failed', err);
          setStatus(err && err.denied ? 'NOT AUTHORISED — SAVED ON THIS DEVICE'
                                      : 'OFFLINE — SAVED ON THIS DEVICE', 'warn');
          return false;
        });
    }

    function start() {
      if (timer) clearInterval(timer);
      timer = setInterval(pull, SYNC_INTERVAL);
      return pull();
    }

    return { push, pull, start, hold };
  })();

  let toastTimer = null;
  function toast(msg, isWarn) {
    const el = document.getElementById('ops-toast');
    el.textContent = msg;
    el.className = 'toast on' + (isWarn ? ' warn' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast' + (isWarn ? ' warn' : ''); }, 2600);
  }

  // Parses 'YYYY-MM-DD' as a local date. new Date('2026-10-12') would be parsed
  // as UTC and can land on the previous day west of Greenwich.
  function parseKey(key) {
    const p = String(key || '').split('-');
    if (p.length !== 3) return null;
    const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return isNaN(d.getTime()) ? null : d;
  }

  function updateCountdowns() {
    const today = new Date();
    [['aosb', 'ops-cd-aosb'], ['sandhurst', 'ops-cd-sandhurst']].forEach(([key, elId]) => {
      const target = parseKey(state.targets[key]);
      const el = document.getElementById(elId);
      if (!target) { el.textContent = '—'; return; }
      const days = daysBetween(today, target);
      el.textContent = days > 0 ? days : (days === 0 ? 'TODAY' : 'PASSED');
    });
  }

  function renderDateBar() {

    if (!isToday) {
      const diff = daysBetween(new Date(), currentDate);
      const rel = diff < 0
        ? Math.abs(diff) + (Math.abs(diff) === 1 ? ' day ago' : ' days ago')
        : diff + (diff === 1 ? ' day ahead' : ' days ahead');
      document.getElementById('ops-viewing-text').textContent = 'Viewing ' + fmtDisplay(currentDate) + ' — ' + rel;
    }
  }

    const dateKeyToday = fmtDate(new Date());

      .map((p,i) => `<span class="p-item"><b>${i+1}</b> ${p}</span>`).join('');

  // Count only log entries that still map to a live habit — deleting a habit
  // leaves its id behind in the log, which would otherwise inflate the totals.
  function habitsDoneOn(dateKey) {
    const log = state.habitLog[dateKey] || [];
    return log.filter(id => state.habits.some(h => h.id === id)).length;
  }

  function renderCharts(viewKey) {
    const todayKey = viewKey || fmtDate(new Date());
    const realToday = fmtDate(new Date());
    const heading = todayKey === realToday
      ? "Today's Progress"
      : 'Progress — ' + (parseKey(todayKey) || new Date()).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

    const habitTotal = state.habits.length;
    const habitDone = habitsDoneOn(todayKey);
    const todaysBlocks = state.scheduleAll[todayKey] || [];
    const blockTotal = todaysBlocks.length;
    const blockDone = todaysBlocks.filter(b => b.done).length;

    const done = habitDone + blockDone;
    const total = habitTotal + blockTotal;
    const pct = total ? Math.round((done / total) * 100) : 0;

    const R = 62;
    const CIRC = 2 * Math.PI * R;
    // Two arcs drawn head-to-tail so the ring matches the legend colours:
    // schedule blocks first, then habits, then the uncompleted remainder.
    const blockArc = total ? (blockDone / total) * CIRC : 0;
    const habitArc = total ? (habitDone / total) * CIRC : 0;

    const donutHtml = `
      <div class="chart-panel">
        <div class="col-head">
          <h3>${heading}</h3>
          <span class="tally">${pct}%</span>
        </div>
        <div class="donut-wrap">
          <svg class="donut" viewBox="0 0 164 164" role="img"
               aria-label="${done} of ${total} items complete today, ${pct} percent">
            <circle class="donut-track" cx="82" cy="82" r="${R}"></circle>
            <circle class="donut-val donut-blocks" cx="82" cy="82" r="${R}"
                    stroke-dasharray="${blockArc.toFixed(2)} ${(CIRC - blockArc).toFixed(2)}"
                    transform="rotate(-90 82 82)"></circle>
            <circle class="donut-val donut-habits" cx="82" cy="82" r="${R}"
                    stroke-dasharray="${habitArc.toFixed(2)} ${(CIRC - habitArc).toFixed(2)}"
                    stroke-dashoffset="${(-blockArc).toFixed(2)}"
                    transform="rotate(-90 82 82)"></circle>
          </svg>
          <div class="donut-center">
            <div class="donut-pct">${pct}%</div>
            <div class="donut-sub">${done}/${total} done</div>
          </div>
        </div>
        <div class="donut-legend">
          <div class="legend-row" style="--dot:var(--green-bright)">
            <span class="legend-dot"></span> Schedule blocks <b>${blockDone}/${blockTotal}</b>
          </div>
          <div class="legend-row" style="--dot:var(--brass)">
            <span class="legend-dot"></span> Habits <b>${habitDone}/${habitTotal}</b>
          </div>
        </div>
      </div>
    `;

    const anchor = parseKey(todayKey) || new Date();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(anchor);
      d.setDate(d.getDate() - i);
      const key = fmtDate(d);
      days.push({
        key,
        count: habitsDoneOn(key),
        label: d.toLocaleDateString('en-GB', { weekday: 'short' }).charAt(0),
        isToday: key === realToday
      });
    }
    // scaleMax is clamped only so bar heights never divide by zero; the
    // displayed denominator must use the real habit count.
    const scaleMax = Math.max(habitTotal, 1);
    const weekTotal = days.reduce((sum, d) => sum + d.count, 0);
    const weekPossible = habitTotal * 7;
    const bestDay = days.reduce((a, b) => (b.count > a.count ? b : a), days[0]);

    const barsHtml = `
      <div class="chart-panel">
        <div class="col-head">
          <h3>Habits — Last 7 Days</h3>
          <span class="tally">${weekTotal}/${weekPossible}</span>
        </div>
        <div class="bars">
          ${days.map(d => {
            const h = scaleMax ? (d.count / scaleMax) * 100 : 0;
            const cls = [
              d.isToday ? 'is-today' : '',
              d.count > 0 && d.count === habitTotal ? 'is-full' : ''
            ].join(' ').trim();
            return `
              <div class="bar-col ${cls}" title="${d.key}: ${d.count}/${habitTotal}">
                <div class="bar-val">${d.count}</div>
                <div class="bar-track">
                  <div class="bar-fill" style="height:${h.toFixed(1)}%"></div>
                </div>
                <div class="bar-day">${d.label}</div>
              </div>
            `;
          }).join('')}
        </div>
        <div class="bar-foot">
          <span>Best day <b>${bestDay.count}/${habitTotal}</b></span>
          <span>Weekly average <b>${(weekTotal / 7).toFixed(1)}</b></span>
        </div>
      </div>
    `;

    let charts = document.querySelector('.charts-section');
    if (!charts) {
      charts = document.createElement('div');
      charts.className = 'charts-section';
      const strip = document.querySelector('.priority-strip');
      strip.parentNode.insertBefore(charts, strip);
    }
    charts.innerHTML = donutHtml + barsHtml;
  }

  // The week strip and streak are anchored to the day being viewed, so browsing
  // back shows that day's context rather than always showing today's.
  function renderHabitRow(h, anchorKey, isFuture) {
    const anchor = parseKey(anchorKey) || new Date();
    const todayKey = fmtDate(new Date());
    let cells = '';
    for (let i = 6; i >= 0; i--) {
      const d = new Date(anchor);
      d.setDate(d.getDate() - i);
      const key = fmtDate(d);
      const on = (state.habitLog[key] || []).includes(h.id);
      cells += `<div class="week-cell ${on ? 'on' : ''}" title="${key}"></div>`;
    }
    let streak = 0;
    for (let i = 0; i < 365; i++) {
      const d = new Date(anchor);
      d.setDate(d.getDate() - i);
      const key = fmtDate(d);
      if (key > todayKey) continue;
      if ((state.habitLog[key] || []).includes(h.id)) streak++;
      else break;
    }
    const done = (state.habitLog[anchorKey] || []).includes(h.id);
    return `
      <div class="habit-row" data-id="${h.id}">
        <button class="block-check ${done ? 'checked' : ''}" data-action="habit-toggle"
                data-id="${h.id}" ${isFuture ? 'disabled style="opacity:.35;cursor:not-allowed"' : ''}></button>
        <span class="habit-name">${escapeHtml(h.name)}</span>
        <span class="habit-streak">${streak > 0 ? streak + 'd streak' : ''}</span>
        <div class="week-grid">${cells}</div>
        <button class="habit-del" data-action="habit-del" data-id="${h.id}">×</button>
      </div>
    `;
  }

  // --- Fitness -------------------------------------------------------------
  // Values are stored as numbers: run in seconds, everything else as-is.
  function parseMetricValue(metricKey, raw) {
    const s = String(raw || '').trim();
    if (!s) return null;
    const m = METRICS[metricKey];
    if (!m) return null;
    if (m.kind === 'time') {
      const parts = s.split(':');
      if (parts.length === 2) {
        const mins = Number(parts[0]), secs = Number(parts[1]);
        if (!isFinite(mins) || !isFinite(secs) || secs >= 60 || mins < 0 || secs < 0) return null;
        return mins * 60 + secs;
      }
      const n = Number(s);
      return isFinite(n) && n > 0 ? n : null;
    }
    const n = Number(s);
    return isFinite(n) && n >= 0 ? n : null;
  }

  function fmtMetricValue(metricKey, val) {
    if (val === null || val === undefined) return '—';
    const m = METRICS[metricKey];
    if (m && m.kind === 'time') {
      const mins = Math.floor(val / 60), secs = Math.round(val % 60);
      return mins + ':' + String(secs).padStart(2, '0');
    }
    return String(Math.round(val * 10) / 10);
  }

  function latestEntry(metricKey) {
    const list = state.fitness.entries
      .filter(e => e.metric === metricKey)
      .sort((a, b) => a.date.localeCompare(b.date));
    return list.length ? list[list.length - 1] : null;
  }

  function bestEntry(metricKey) {
    const m = METRICS[metricKey];
    const list = state.fitness.entries.filter(e => e.metric === metricKey);
    if (!list.length) return null;
    return list.reduce((best, e) =>
      (m.lowerBetter ? e.value < best.value : e.value > best.value) ? e : best, list[0]);
  }

  function renderFitness() {
    const cards = Object.keys(METRICS).map(key => {
      const m = METRICS[key];
      const latest = latestEntry(key);
      const best = bestEntry(key);
      const targetRaw = state.fitness.targets[key];
      const target = (targetRaw === null || targetRaw === undefined) ? null : Number(targetRaw);

      let pct = 0, deltaHtml = '';
      if (latest && target !== null && isFinite(target) && target > 0) {
        pct = m.lowerBetter
          ? Math.min(100, (target / latest.value) * 100)
          : Math.min(100, (latest.value / target) * 100);
        const hit = m.lowerBetter ? latest.value <= target : latest.value >= target;
        if (hit) {
          deltaHtml = '<span class="fit-delta good">target met</span>';
        } else {
          const gap = m.lowerBetter ? latest.value - target : target - latest.value;
          deltaHtml = '<span class="fit-delta bad">' + fmtMetricValue(key, gap) + ' to go</span>';
        }
      }

      return `
        <div class="fit-card" style="--metric-color:${m.color}">
          <div class="fit-name">${m.label}</div>
          <div class="fit-val ${latest ? '' : 'none'}">${latest ? fmtMetricValue(key, latest.value) : 'no data'}</div>
          <div class="fit-meta">
            ${target !== null && isFinite(target)
              ? 'Target ' + fmtMetricValue(key, target) + (deltaHtml ? ' · ' + deltaHtml : '')
              : '<button class="tool-btn" style="padding:2px 7px;font-size:9.5px" data-action="set-target" data-metric="' + key + '">Set target</button>'}
          </div>
          <div class="fit-bar"><span style="width:${pct.toFixed(1)}%"></span></div>
          <div class="fit-meta">${best ? 'Best ' + fmtMetricValue(key, best.value) + ' · ' + state.fitness.entries.filter(e=>e.metric===key).length + ' logged' : 'No entries yet'}</div>
        </div>
      `;
    }).join('');

    const html = `
      <div class="col-head">
        <h3>Fitness</h3>
        <span class="tally">${state.fitness.entries.length} entries</span>
      </div>
      <div class="fit-grid">${cards}</div>
      <div class="fit-form">
        <select id="ops-fit-metric">
          ${Object.keys(METRICS).map(k => `<option value="${k}">${METRICS[k].label}</option>`).join('')}
        </select>
        <input type="text" id="ops-fit-value" placeholder="e.g. 9:30">
        <input type="date" id="ops-fit-date" value="${fmtDate(new Date())}">
        <button id="ops-fit-add">Log</button>
        <button id="ops-fit-target" class="tool-btn">Set target</button>
      </div>
      <div class="fit-hint">
        Press-ups and sit-ups as reps · bleep test as level (e.g. 10.5).
        Targets are yours to set — nothing here is an official standard, so check the current
        requirements and enter them yourself.
      </div>
    `;

    let sec = document.querySelector('.fitness-section');
    if (!sec) {
      sec = document.createElement('div');
      sec.className = 'fitness-section';
      const strip = document.querySelector('.priority-strip');
      strip.parentNode.insertBefore(sec, strip);
    }
    sec.innerHTML = html;
    attachFitnessHandlers();
  }

  function renderNotes(dateKey) {
    const notes = (state.notesAll[dateKey] || []).slice().sort((a, b) => a.time.localeCompare(b.time));

    const html = `
      <div class="col-head">
        <h3>Daily Notes</h3>
        <span class="tally">${notes.length} ${notes.length === 1 ? 'entry' : 'entries'}</span>
      </div>
      <div class="notes-form">
        <input type="text" id="ops-new-note" placeholder="Add a note, thought, or reminder..." maxlength="500">
        <button id="ops-add-note">Add</button>
      </div>
      <div id="ops-notes-list">
        ${notes.length === 0
          ? '<div class="empty-note">No notes today — add one above.</div>'
          : notes.map(n => `
            <div class="note-row" data-id="${n.id}">
              <span class="note-time mono">${n.time}</span>
              <span class="note-text">${escapeHtml(n.text)}</span>
              <button class="note-del" data-action="del-note" data-id="${n.id}">×</button>
            </div>
          `).join('')}
      </div>
    `;

    let sec = document.querySelector('.notes-section');
    if (!sec) {
      sec = document.createElement('div');
      sec.className = 'notes-section';
      const strip = document.querySelector('.priority-strip');
      strip.parentNode.insertBefore(sec, strip);
    }
    sec.innerHTML = html;
    attachNotesHandlers(dateKey);
  }

  function attachNotesHandlers(dateKey) {
    const input = document.getElementById('ops-new-note');
    const addNote = () => {
      const text = input.value.trim();
      if (!text) return;
      if (!state.notesAll[dateKey]) state.notesAll[dateKey] = [];
      const now = new Date();
      const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      state.notesAll[dateKey].push({ id: uid(), time, text });
      saveNotes();
      input.value = '';
      renderNotes(dateKey);
    };
    document.getElementById('ops-add-note').onclick = addNote;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addNote(); });

    document.querySelectorAll('[data-action="del-note"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        state.notesAll[dateKey] = (state.notesAll[dateKey] || []).filter(n => n.id !== id);
        saveNotes();
        renderNotes(dateKey);
      };
    });
  }

  function attachFitnessHandlers() {
    document.getElementById('ops-fit-add').onclick = () => {
      const key = document.getElementById('ops-fit-metric').value;
      const raw = document.getElementById('ops-fit-value').value;
      const date = document.getElementById('ops-fit-date').value || fmtDate(new Date());
      const val = parseMetricValue(key, raw);
      if (val === null) {
        toast('Could not read "' + raw + '" — ' + (METRICS[key].kind === 'time' ? 'use mm:ss, e.g. 9:30' : 'use a number'), true);
        return;
      }
      state.fitness.entries.push({ id: uid(), metric: key, value: val, date: date });
      saveFitness();
      document.getElementById('ops-fit-value').value = '';
      toast(METRICS[key].label + ' logged: ' + fmtMetricValue(key, val));
      renderFitness();
    };

    function setTargetFor(key) {
      const m = METRICS[key];
      const cur = state.fitness.targets[key];
      const raw = prompt(
        'Target for ' + m.label + (m.kind === 'time' ? ' (mm:ss)' : ' (' + m.unit + ')') + ':',
        cur !== undefined && cur !== null ? fmtMetricValue(key, cur) : ''
      );
      if (raw === null) return;
      if (!String(raw).trim()) {
        delete state.fitness.targets[key];
        saveFitness(); renderFitness();
        toast('Target cleared for ' + m.label);
        return;
      }
      const val = parseMetricValue(key, raw);
      if (val === null) { toast('Could not read that target', true); return; }
      state.fitness.targets[key] = val;
      saveFitness(); renderFitness();
      toast(m.label + ' target set to ' + fmtMetricValue(key, val));
    }

    document.getElementById('ops-fit-target').onclick = () => {
      setTargetFor(document.getElementById('ops-fit-metric').value);
    };
    document.querySelectorAll('[data-action="set-target"]').forEach(btn => {
      btn.onclick = () => setTargetFor(btn.dataset.metric);
    });
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function attachHandlers(dateKey, isFuture) {
    document.getElementById('ops-add-block').onclick = () => {
      const time = document.getElementById('ops-new-time').value || '09:00';
      const label = document.getElementById('ops-new-label').value.trim();
      const cat = document.getElementById('ops-new-cat').value;
      if (!label) return;
      if (!state.scheduleAll[dateKey]) state.scheduleAll[dateKey] = [];
      state.scheduleAll[dateKey].push({ id: uid(), time, label, cat, done: false });
      saveSchedule();
      renderBody();
    };

    document.querySelectorAll('[data-action="toggle"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const list = state.scheduleAll[dateKey] || [];
        const item = list.find(b => b.id === id);
        if (item) item.done = !item.done;
        saveSchedule();
        renderBody();
      };
    });
    document.querySelectorAll('[data-action="del"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        state.scheduleAll[dateKey] = (state.scheduleAll[dateKey] || []).filter(b => b.id !== id);
        saveSchedule();
        renderBody();
      };
    });

    document.getElementById('ops-add-habit').onclick = () => {
      const input = document.getElementById('ops-new-habit');
      const name = input.value.trim();
      if (!name) return;
      state.habits.push({ id: uid(), name });
      saveHabits();
      renderBody();
    };
    document.querySelectorAll('[data-action="habit-toggle"]').forEach(btn => {
      btn.onclick = () => {
        if (isFuture) return;
        const id = btn.dataset.id;
        if (!state.habitLog[dateKey]) state.habitLog[dateKey] = [];
        const idx = state.habitLog[dateKey].indexOf(id);
        if (idx >= 0) state.habitLog[dateKey].splice(idx, 1);
        else state.habitLog[dateKey].push(id);
        if (!state.habitLog[dateKey].length) delete state.habitLog[dateKey];
        saveHabitLog();
        renderBody();
      };
    });
    document.querySelectorAll('[data-action="habit-del"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const habit = state.habits.find(h => h.id === id);
        if (habit && !confirm('Delete "' + habit.name + '"? Its history stays in your backups but disappears from the tracker.')) return;
        state.habits = state.habits.filter(h => h.id !== id);
        saveHabits();
        renderBody();
      };
    });
  }

  // --- Day tools -----------------------------------------------------------
  function copyBlocks(list) {
    return (list || []).map(b => ({ id: uid(), time: b.time, label: b.label, cat: b.cat, done: false }));
  }

  function copyPreviousDay() {
    const prev = new Date(currentDate);
    prev.setDate(prev.getDate() - 1);
    const prevKey = fmtDate(prev);
    const source = state.scheduleAll[prevKey] || [];
    if (!source.length) { toast('Nothing to copy — ' + fmtDisplay(prev) + ' has no blocks', true); return; }
    const dateKey = fmtDate(currentDate);
    state.scheduleAll[dateKey] = (state.scheduleAll[dateKey] || []).concat(copyBlocks(source));
    saveSchedule();
    renderBody();
    toast('Copied ' + source.length + ' block' + (source.length === 1 ? '' : 's') + ' from ' + fmtDisplay(prev));
  }

  function saveAsTemplate() {
    const dateKey = fmtDate(currentDate);
    const blocks = state.scheduleAll[dateKey] || [];
    if (!blocks.length) { toast('Add some blocks first, then save them as a template', true); return; }
    state.template = blocks.map(b => ({ time: b.time, label: b.label, cat: b.cat }));
    saveTemplate();
    toast('Template saved — ' + blocks.length + ' block' + (blocks.length === 1 ? '' : 's'));
  }

  function applyTemplate() {
    if (!state.template.length) { toast('No template saved yet — build a day and hit "Save as template"', true); return; }
    const dateKey = fmtDate(currentDate);
    state.scheduleAll[dateKey] = (state.scheduleAll[dateKey] || []).concat(copyBlocks(state.template));
    saveSchedule();
    renderBody();
    toast('Applied template — ' + state.template.length + ' block' + (state.template.length === 1 ? '' : 's') + ' added');
  }

  // --- Backup --------------------------------------------------------------
  function exportBackup() {
    const payload = {
      format: 'daily-ops-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      schedule: state.scheduleAll,
      habits: state.habits,
      habitLog: state.habitLog,
      template: state.template,
      targets: state.targets,
      fitness: state.fitness,
      notes: state.notesAll
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'daily-ops-backup-' + fmtDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup downloaded');
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch(e) { toast('That file is not valid JSON', true); return; }

      if (!data || data.format !== 'daily-ops-backup') {
        toast('That does not look like a Daily Ops backup', true);
        return;
      }
      const counts = [
        Object.keys(data.schedule || {}).length + ' scheduled day(s)',
        (data.habits || []).length + ' habit(s)',
        Object.keys(data.habitLog || {}).length + ' logged day(s)',
        ((data.fitness && data.fitness.entries) || []).length + ' fitness entr(ies)'
      ].join('\n');
      if (!confirm('Restore this backup?\n\n' + counts + '\n\nThis REPLACES everything currently on this device.')) return;

      state.scheduleAll = data.schedule || {};
      state.habits      = Array.isArray(data.habits) ? data.habits : [];
      state.habitLog    = data.habitLog || {};
      state.template    = Array.isArray(data.template) ? data.template : [];
      state.targets     = Object.assign({}, DEFAULT_TARGETS, data.targets || {});
      state.fitness     = {
        entries: (data.fitness && Array.isArray(data.fitness.entries)) ? data.fitness.entries : [],
        targets: (data.fitness && data.fitness.targets) ? data.fitness.targets : {}
      };
      saveSchedule(); saveHabits(); saveHabitLog();
      saveTemplate(); saveTargets(); saveFitness();
      updateCountdowns(); renderDateBar(); renderBody();
      toast('Backup restored');
    };
    reader.onerror = () => toast('Could not read that file', true);
    reader.readAsText(file);
  }

  function editTarget(key, label) {
    const cur = state.targets[key] || '';
    const raw = prompt('Date for ' + label + ' (YYYY-MM-DD):', cur);
    if (raw === null) return;
    const trimmed = String(raw).trim();
    if (!parseKey(trimmed)) { toast('Use the format YYYY-MM-DD, e.g. 2026-10-12', true); return; }
    state.targets[key] = trimmed;
    saveTargets();
    updateCountdowns();
    toast(label + ' set to ' + fmtDisplay(parseKey(trimmed)));
  }

  function shiftDay(delta) {
    currentDate.setDate(currentDate.getDate() + delta);
    renderDateBar(); renderBody();
  }
  function goToday() {
    currentDate = new Date();
    renderDateBar(); renderBody();
  }

  document.getElementById('ops-prev').onclick = () => shiftDay(-1);
  document.getElementById('ops-next').onclick = () => shiftDay(1);
  document.getElementById('ops-today').onclick = goToday;
  document.getElementById('ops-viewing-back').onclick = goToday;

  document.getElementById('ops-copy-prev').onclick = copyPreviousDay;
  document.getElementById('ops-save-tpl').onclick = saveAsTemplate;
  document.getElementById('ops-apply-tpl').onclick = applyTemplate;
  document.getElementById('ops-export').onclick = exportBackup;

  const importInput = document.getElementById('ops-import-file');
  document.getElementById('ops-import').onclick = () => importInput.click();
  importInput.onchange = () => {
    if (importInput.files && importInput.files[0]) importBackup(importInput.files[0]);
    importInput.value = '';
  };

  document.getElementById('ops-edit-aosb').onclick = () => editTarget('aosb', 'AOSB');
  document.getElementById('ops-edit-sandhurst').onclick = () => editTarget('sandhurst', 'Sandhurst');

  // Arrow keys move between days, T jumps back to today — but never while the
  // user is part-way through typing into a field.
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); shiftDay(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); shiftDay(1); }
    else if (e.key === 't' || e.key === 'T') { e.preventDefault(); goToday(); }
  });

  // Keep the sticky date bar sitting exactly below the header, whatever height
  // the header happens to be at this viewport width.
  function syncStickyOffset() {
    const sitrep = document.querySelector('.sitrep');
    if (!sitrep) return;
    document.documentElement.style.setProperty('--sitrep-h', Math.round(sitrep.getBoundingClientRect().height) + 'px');
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncStickyOffset).observe(document.querySelector('.sitrep'));
  }
  window.addEventListener('resize', syncStickyOffset);
  syncStickyOffset();

  // Held before loadAll() so the defaults it seeds on a fresh device
  // can't beat the first pull to the database. Sync.start() releases.
  Sync.hold();

  loadAll();
  updateCountdowns();
  renderDateBar();
  renderBody();
  Auth.showDeviceId();
  Sync.start();

  // Re-check the date when the tab is refocused, so a planner left open
  // overnight rolls over instead of showing yesterday as "today". Also a
  // good moment to pull: the other device may have moved on while this
  // tab sat in the background.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { updateCountdowns(); renderDateBar(); renderBody(); Sync.pull(); }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
    });
  }
})();
</script>
</body>
</html>
